<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070c09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Expense Tracker — Standalone, Mobile-First Personal Finance Tracking App with Offline Caching & Cloud Sync.">
  <title>Expense Tracker — PLAN · TRACK · SAVE · GROW</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css?v=4.5">
  
  <!-- Immediate Early Theme Color Initialization (Prevents Style Flash) -->
  <script>
    (function() {
      try {
        var s = localStorage.getItem('expense_tracker_profile');
        var color = '#c8f53c';
        if (s) {
          var p = JSON.parse(s);
          if (p && p.themeColor) color = p.themeColor;
        }
        var root = document.documentElement;
        root.style.setProperty('--neon-lime', color);
        root.style.setProperty('--neon-green', color);
        root.style.setProperty('--theme-accent', color);
        var c = color.replace('#', '');
        if (c.length === 3) c = c.split('').map(function(x) { return x + x; }).join('');
        var num = parseInt(c, 16);
        if (!isNaN(num)) {
          var r = (num >> 16) & 255;
          var g = (num >> 8) & 255;
          var b = num & 255;
          root.style.setProperty('--neon-green-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
          root.style.setProperty('--neon-green-subtle', 'rgba(' + r + ',' + g + ',' + b + ',0.12)');
          root.style.setProperty('--neon-green-border', 'rgba(' + r + ',' + g + ',' + b + ',0.28)');
          root.style.setProperty('--neon-lime-subtle', 'rgba(' + r + ',' + g + ',' + b + ',0.12)');
          root.style.setProperty('--neon-lime-border', 'rgba(' + r + ',' + g + ',' + b + ',0.28)');
          root.style.setProperty('--border-card', 'rgba(' + r + ',' + g + ',' + b + ',0.18)');
        }
      } catch (e) {}
    })();
  </script>

  <!-- React 18 & ReactDOM Production UMD Bundles -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  
  <!-- Supabase Cloud Client UMD Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- jsPDF & AutoTable for Clean Monthly Statement Exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="pdf-generator.js?v=4.5"></script>
</head>
<body>
  <!-- APPLICATION MOUNT ROOT -->
  <div id="root">
    <!-- Initial App Skeleton Loader (Replaced on React Mount) -->
    <div style="max-width: 1100px; margin: 0 auto; padding: 20px;">
      <div style="height: 64px; background: rgba(16, 26, 20, 0.7); border-radius: 20px; margin-bottom: 20px;"></div>
      <div style="height: 160px; background: rgba(16, 26, 20, 0.7); border-radius: 20px; margin-bottom: 20px;"></div>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px;">
        <div style="height: 80px; background: rgba(16, 26, 20, 0.7); border-radius: 14px;"></div>
        <div style="height: 80px; background: rgba(16, 26, 20, 0.7); border-radius: 14px;"></div>
        <div style="height: 80px; background: rgba(16, 26, 20, 0.7); border-radius: 14px;"></div>
      </div>
    </div>
  </div>

  <!-- SMS TRANSACTION DETECTION & ANDROID NATIVE BRIDGE -->
  <script src="sms-parser.js?v=4.5"></script>
  <script src="sms-bridge.js?v=4.5"></script>

  <!-- MAIN REACT APPLICATION LOGIC -->
  <script src="app.js?v=4.5"></script>

  <!-- PWA SERVICE WORKER REGISTRATION -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js?v=4.5')
          .then((reg) => {
            console.log('[PWA] Service Worker registered with scope:', reg.scope);
            try { reg.update(); } catch (e) {}
            document.addEventListener('visibilitychange', () => {
              if (!document.hidden) { try { reg.update(); } catch (e) {} }
            });
            window.addEventListener('focus', () => { try { reg.update(); } catch (e) {} });
          })
          .catch((err) => console.warn('[PWA] Service worker registration failed:', err));
      });
    }
  </script>

  <!-- LIVE RELOAD SCRIPT (Instantly auto-refreshes phone & desktop on workspace file updates) -->
  <script>
    (function initLiveReload() {
      let lastStamp = null;
      function getReloadBaseUrl() {
        if (window.location && window.location.origin && window.location.origin.startsWith('http')) {
          return window.location.origin;
        }
        return localStorage.getItem('exptrk_sync_server_url') || 'http://10.216.40.100:3000';
      }
      async function poll() {
        try {
          const res = await fetch(getReloadBaseUrl() + '/live-reload-check?_t=' + Date.now(), { cache: 'no-store' });
          if (res.ok) {
            const stamp = (await res.text()).trim();
            if (lastStamp !== null && stamp && stamp !== lastStamp) {
              console.log('[LiveReload] Change detected (' + stamp + '). Auto-refreshing...');
              window.location.reload();
              return;
            }
            lastStamp = stamp;
          }
        } catch (err) {}
        setTimeout(poll, 1000);
      }
      setTimeout(poll, 1200);
    })();
  </script>
</body>
</html>
